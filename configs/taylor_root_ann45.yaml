model:
  type: taylor_root_regressor
  backbone: ann
  input:
    feature: taylor_coefficients
    order: 45
  output:
    num_roots: 45
architecture:
  hidden_dim: 25
  layers: auto
training:
  batch_size: 2048
  epochs: 1000
  learning_rate: 3.0e-5
loss:
  type: min_residual
  description: >
    Minimum |f(r_s)| among 25 predicted roots per sample.