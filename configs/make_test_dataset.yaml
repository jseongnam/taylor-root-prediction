# configs/make_test_dataset.yaml
dataset:
  name: taylor_test_physchem_v3_allroots
  degree: 25
  n_total: 10000
  seed: 0

  # global x range (role에 따라 내부에서 자동 clip될 수 있음)
  x_min: -1000.0
  x_max: 1000.0

  # roots extraction (numpy.roots)
  imag_tol: 1e-8
  merge_tol: 1e-6
  in_eps: 0.0

domains:
  scan_n: 1601
  y_abs_max_true: 200.0
  gap_eps: 1e-6
  min_width: 0.05
  max_domains_keep: 6

roots:
  scope: all_domains        # all_domains | chosen_domain
  max_roots: 25             # root0_all/root1_all padding length
  choose_policy: most_roots_then_width  # most_roots_then_width | first

output:
  # repo root 기준 상대경로
  npz_path: data/test/v6/taylor_test_physchem_v3_allroots_10000.npz
