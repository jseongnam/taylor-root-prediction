dataset:
  max_degree: 50
  degree_list: [50]
  n_total: 10000
  seed: 0
  x_min: -1000.0
  x_max: 1000.0
  imag_tol: 1e-8
  merge_tol: 1e-6
  in_eps: 0.0

domains:
  scan_n: 1601
  y_abs_max_true: 200.0
  gap_eps: 1e-6
  min_width: 0.05
  max_domains_keep: 6

roots:
  scope: all_domains
  max_roots: 25
  choose_policy: most_roots_then_width

output:
  npz_path: data/test/taylor_test_physchem_v3_allroots_maxdeg50_10000.npz