# configs/eval_k_sweep.yaml
# evaluate_k_sweep.py 전용 설정

outdir: runs_k_sweep_viz

device: auto          # auto | cuda | cpu
batch_size: 256

data:
  data_dir: /home/seokjun/math_12_3
  test_npz: v6/taylor_test_physchem_v3_allroots_10000.npz
  # test_npz 내부 key:
  #   - coeffs: (N, degree+1)
  #   - func_expr or expr_str: (N,)
  #   - (optional) func_id: (N,)
  #   - (optional) domains/domain_count or x_min/x_max

models:
  ast_ckpt: /home/seokjun/math_12_3/expr_center_ast_best_50.pt
  anchored_ckpt: /home/seokjun/math_12_3/taylor_data_physchem_v4_deg25/v4_expect25_deg25_mlp_hd25_best_fx_mse.pt
  ann_ckpt: /home/seokjun/math_12_3/mdpi_fnn_best.pt
  lstm_ckpt: /home/seokjun/math_12_3/lstm_root_best_npz.pt

k_sweep:
  topk_list: "5,10,15,20,25,30,35,40,45,50"

thresholds:
  compare_thr: 1.0e-10
  thr_sweep: "1e-6,1e-8,1e-10,1e-12"

solver:
  # candidate 정렬 기준: poly | true
  proxy: poly

  # 한 샘플에서 후보 몇 개까지 solver 시도할지
  max_tries: 10

  # true면 첫 성공(root 1개 찾음)에서 종료
  stop_after_first_success: false

  # newton | bisect | newton_bisect
  solver_mode: newton_bisect

  # solver tolerance (|f(x)| <= tol_f면 충분히 수렴으로 간주)
  tol_f: 1.0e-10

  # newton
  newton_iters: 30
  newton_max_step: 2.0

  # bisection
  bisect_iters: 60

  # local bracket scan (x0 주변)
  local_radius: 1.0
  local_scan_n: 101
  local_max_brackets: 10

  # postcheck stability near root
  stable_radius: 1.0
  stable_scan_n: 80
  stable_valid_min: 0.7
  stable_dfx_min: 1.0e-10

baseline:
  # all | on_demand | none
  mode: all

  # global scan range
  scan_xmin: -20.0
  scan_xmax: +20.0
  scan_n: 250

  # bracket 후보 상위 topk만 시도
  topk: 10

  # anchored_fb: auto | on | off
  # - auto: baseline.mode != none이면 켬
  # - on: 강제 켬 (baseline.mode가 none이면 on_demand로 강제 변경)
  # - off: 끔
  anchored_fb: auto

reports:
  # --thr-winner-okonly
  thr_winner_okonly: true

  # --report-funcid-winner
  report_funcid_winner: true
  report_funcid_winner_mode: both      # any | okonly | both
  report_funcid_winner_expr_k: 3
  report_funcid_winner_topn: 50

  # --report-fail-funcid
  report_fail_funcid: true
  report_fail_mode: baseline           # baseline | all
  report_fail_funcid_topn: 30
  report_fail_expr_k: 3

plots:
  # --plot-residual-hist
  plot_residual_hist: true

  # --plot-funcid-box
  plot_funcid_box: true
  plot_topn_funcid: 15

runtime:
  suppress_runtime_warnings: false
