model:
  input:
    order: 25
  output:
    num_roots: 1

architecture:
  hidden_dim: 256
  layers: auto
  activation: tanh
  dropout: 0.0
  bounded_output: true
  root_range: 10.0

training:
  batch_size: 1024
  epochs: 200
  learning_rate: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  eval_every: 1
  num_workers: 0
  seed: 1234
  early_stop: 20
  topk_train: 5
  topk_eval: 10
  train_reduce: softmin
  temperature: 5.0

loss:
  type: softmin_residual
  residual_transform: logabs
  root_clip: 0.0
  root_l2_weight: 0.0
  diversity_weight: 0.0
  diversity_margin: 1.0e-2

ast:
  batch_size: 4096
  cache_dir: center_cache