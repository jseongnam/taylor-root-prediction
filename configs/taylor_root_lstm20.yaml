model:
  type: taylor_root_regressor
  backbone: lstm
  input:
    feature: taylor_coefficients
    order: 20
  output:
    num_roots: 20
architecture:
  hidden_dim: 25
  layers: auto
training:
  batch_size: 2048
  epochs: 1000
  learning_rate: 3.0e-5
loss:
  type: min_residual
  description: >
    Minimum |f(r_s)| among 25 predicted roots per sample.