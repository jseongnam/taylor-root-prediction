model:
  type: taylor_root_regressor
  backbone: mlp

  input:
    feature: taylor_coefficients
    order: 30
    dimension: 31

  output:
    num_roots: 30

architecture:
  hidden_dim: 25
  layers: auto

training:
  dataset_size: 1000000
  batch_size: 2048
  epochs: 1000
  learning_rate: 3.0e-5

loss:
  type: min_residual
  description: >
    Minimum |f(r_s)| among 25 predicted roots per sample.
