model:
  type: taylor_root_regressor
  backbone: ann
  input:
    feature: taylor_coefficients
    order: 25
  output:
    num_roots: 25

architecture:
  hidden_dim: 256
  layers: auto
  activation: tanh
  dropout: 0.0
  bounded_output: true
  root_range: 10.0

training:
  batch_size: 8192
  epochs: 300
  learning_rate: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  eval_every: 1
  num_workers: 4
  seed: 1234
  early_stop: 20
  amp: true

loss:
  # min_residual | softmin_residual
  type: softmin_residual

  # residual transform: abs | logabs | sq
  residual_transform: logabs

  # roots clamp during residual eval (0이면 비활성)
  root_clip: 0.0

  # softmin temperature
  softmin_tau: 0.05

  # regularizers
  root_l2_weight: 1.0e-6
  diversity_weight: 1.0e-3
  diversity_margin: 1.0e-2
  min_root_separation: 0.0

  # optional augmentation + consistency
  coeff_noise_std: 0.01
  coeff_noise_prob: 1.0
  consistency_weight: 1.0e-2
  consistency_mode: roots
